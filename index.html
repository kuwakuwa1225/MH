<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アーティア厳選ナビ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Monster Hunter Wilds</p>
        <h1>アーティア厳選ナビ</h1>
      </div>
      <button class="ghost danger-text" onclick="resetAllData()">記録削除</button>
    </header>

    <section id="setup-view" class="card">
      <h2>記録を開始</h2>
      <p class="muted">検証に使う素材を1種類決め、その開始所持数を入力してください。復元1回につき素材3個消費として現在位置を計算します。</p>
      <label class="field-label" for="start-material">開始素材数</label>
      <input id="start-material" class="big-input" type="number" min="0" inputmode="numeric" placeholder="例: 120">
      <button class="primary full" onclick="startSurvey()">記録開始</button>
    </section>

    <section id="survey-view" class="hidden">
      <div class="card status-card">
        <div>
          <p class="muted small">現在位置</p>
          <p class="count-display"><span id="survey-count">0</span>回目</p>
        </div>
        <div class="material-box">
          <label class="field-label" for="current-material">現在素材数</label>
          <input id="current-material" type="number" min="0" inputmode="numeric" oninput="updateCountFromMaterial()">
          <p id="material-status" class="muted small"></p>
        </div>
      </div>

      <div class="card">
        <div class="section-heading">
          <div>
            <h2>属性別スキル記録</h2>
            <p class="muted small">同じ回数・同じ属性に複数スキルを記録できます。スキル名は「/」または「,」区切りでもOKです。</p>
          </div>
          <button class="secondary" onclick="finishSurvey()">記録終了</button>
        </div>

        <div class="attribute-tabs" id="attribute-tabs"></div>
        <div id="survey-editor"></div>
      </div>
    </section>

    <section id="play-view" class="hidden">
      <div class="hero-card">
        <p class="muted">現在位置</p>
        <p class="hero-count"><span id="play-count">0</span>回目</p>
        <div id="next-result" class="next-result"></div>
        <div class="counter-actions">
          <button class="counter secondary" onclick="stepPlay(-1)">−1</button>
          <button class="counter primary" onclick="stepPlay(1)">＋1回進める</button>
        </div>
      </div>

      <div class="card">
        <div class="section-heading">
          <div>
            <h2>次の候補</h2>
            <p class="muted small">各属性で次に記録済みスキルが出るまでの回数を自動表示します。</p>
          </div>
          <button class="ghost" onclick="returnToSurvey()">記録を修正</button>
        </div>
        <div id="upcoming-list" class="upcoming-list"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
